name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the token npm checks against the trusted publisher, and signs provenance with.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # For the npm it bundles: trusted publishing needs 11.5.1 or newer, and an older one
          # falls back to looking for a token rather than saying what it wanted.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm refuses a version it already has, so a tag that says something else can only be a
      # mistake, and it is cheaper to fail here than to publish under the wrong number.
      - name: Check the tag against the package version
        run: |
          tagged=${GITHUB_REF_NAME#v}
          declared=$(node -p 'require("./package.json").version')
          if [ "$tagged" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${declared}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # No token anywhere: npm trades the run's OIDC token for publish rights, and a
      # NODE_AUTH_TOKEN in the environment would send it down the token path instead.
      - run: npm publish --provenance --access public
