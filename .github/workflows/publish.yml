name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm record where the package was built from.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm refuses a version it already has, so a tag that says something else can only be a
      # mistake, and it is cheaper to fail here than to publish under the wrong number.
      - name: Check the tag against the package version
        run: |
          tagged=${GITHUB_REF_NAME#v}
          declared=$(node -p 'require("./package.json").version')
          if [ "$tagged" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${declared}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
