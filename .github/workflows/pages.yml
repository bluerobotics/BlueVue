name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# What deploy-pages needs to mint its own credential; nothing here reads or writes the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a push that lands mid-run wins: the site should end up matching
# master rather than whichever run happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
