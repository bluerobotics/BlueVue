name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# The token must be able to force-push the orphan gh-pages branch.
permissions:
  contents: write

# One deployment at a time, and a push that lands mid-run wins: the site should end up matching
# master rather than whichever run happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run docs:build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-dist
          publish_branch: gh-pages
          force_orphan: true
